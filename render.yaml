services:
  - type: web
    name: clinica-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: MODEL_NAME
        value: gpt-4o-mini
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_API_VERSION
        value: v20.0
      - key: DOCS_DIR
        value: docs
      - key: DATABASE_URL
        fromDatabase:
          name: clinica-db
          property: connectionString

databases:
  - name: clinica-db
    plan: free
    databaseName: clinica_bot
    user: bot
